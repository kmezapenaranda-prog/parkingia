version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: parking-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkinguser
      POSTGRES_PASSWORD: parkingpass
      POSTGRES_DB: parkingdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
